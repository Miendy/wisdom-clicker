<script>
let wisdom = [];

fetch("wisdoms.txt")
  .then((r) => r.text())
  .then((txt) => {
    wisdom = [...new Set(
      txt.split("\n")
        .map((l) => l.trim().replace(/,$/, "").replace(/^"|"$/g, ""))
        .filter(Boolean)
    )];
  });

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const words = document.getElementById("words");
const bubble = document.getElementById("bubble");
const frame = document.getElementById("frame");
const live = document.getElementById("live");
const btn = document.getElementById("btn");

let bag = [];
let last = -1;
let typer = null;

function next() {
  if (bag.length === 0) {
    bag = wisdom.map((_, i) => i).sort(() => Math.random() - 0.5);
    if (bag[bag.length - 1] === last && bag.length > 1) bag.unshift(bag.pop());
  }
  last = bag.pop();
  return wisdom[last];
}

function replay(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

function type(text) {
  clearInterval(typer);
  if (reduce || instant) {
    words.textContent = text;
    return;
  }
  let i = 0;
  words.textContent = "";
  words.classList.add("cursor");
  typer = setInterval(() => {
    i += 1;
    words.textContent = text.slice(0, i);
    if (i >= text.length) {
      clearInterval(typer);
      words.classList.remove("cursor");
    }
  }, 22);
}

const bits = ["🍊", "✨", "⭐", "🐾", "🍊", "💫", "🧡"];

function burst(count = 26) {
  const r = frame.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height * 0.25;
  for (let n = 0; n < count; n++) {
    const el = document.createElement("span");
    el.className = "bit";
    el.textContent = bits[Math.floor(Math.random() * bits.length)];
    document.body.appendChild(el);
    const angle = Math.random() * Math.PI * 2;
    const dist = 90 + Math.random() * 190;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 60;
    const spin = (Math.random() - 0.5) * 720;
    const size = 0.7 + Math.random() * 1.1;
    const anim = el.animate([
      { transform: `translate(${cx}px, ${cy}px) scale(0.2) rotate(0deg)`, opacity: 1 },
      { transform: `translate(${cx + dx}px, ${cy + dy}px) scale(${size}) rotate(${spin / 2}deg)`, opacity: 1, offset: 0.55 },
      { transform: `translate(${cx + dx * 1.15}px, ${cy + dy + 220}px) scale(${size * 0.8}) rotate(${spin}deg)`, opacity: 0 }
    ], { duration: 1100 + Math.random() * 600, easing: "cubic-bezier(.2,.7,.4,1)" });
    anim.onfinish = () => el.remove();
  }
}

function speak() {
  const text = next();
  live.textContent = text;
  type(text);
  replay(bubble, "hit");
  if (!reduce) {
    replay(frame, clicks % 25 === 0 ? "jump" : "tap");
    burst(5);
  }
}

frame.addEventListener("animationend", (e) => {
  if (e.animationName === "jump" || e.animationName === "tap") frame.classList.remove(e.animationName);
});
const scolds = [
  "Slow down, youngin. Wisdom is not a slot machine.",
  "Your thumb needs a hobby.",
  "Click again and I will push your phone off the table.",
  "Did you think wisdom comes faster if you tap harder?",
  "Patience, kitten. Even the tangerine took its time.",
  "That is not how a wise one clicks. That is how a goldfish clicks.",
  "I have napped through longer attention spans than yours.",
  "One more and I will sit on your keyboard.",
  "Breathe. Blink slowly. Then click like you mean it.",
  "You are making me lose my zen, youngin."
];

const taunts = [
  "Is that all you have?",
  "My tangerines are ripe for revenge.",
  "Click faster. I dare you.",
  "You will nap in shame.",
  "Dodge this, youngin."
];

const cut = document.getElementById("cut");
const cutline = document.getElementById("cutline");
const skip = document.getElementById("skip");
const flashEl = document.getElementById("flash");
const arena = document.getElementById("arena");
const bossBox = document.getElementById("boss");
const hpEl = document.getElementById("hp");
const hearts = document.getElementById("hearts");
const taunt = document.getElementById("taunt");
const field = document.getElementById("field");
const endEl = document.getElementById("end");
const endT = document.getElementById("endt");
const endP = document.getElementById("endp");
const again = document.getElementById("again");

document.querySelectorAll(".bossimg").forEach((img) => {
  img.src = frame.querySelector("img").src;
});

let rage = 0;
let lastClick = 0;
let fighting = false;
let skipped = false;
let wake = null;
let boss = 100;
let me = 3;
let running = false;
let won = false;
let spawner = null;

const sleep = (ms) => (skipped || reduce)
  ? Promise.resolve()
  : new Promise((r) => { wake = r; setTimeout(r, ms); });

skip.addEventListener("click", () => {
  skipped = true;
  if (wake) wake();
});

frame.addEventListener("animationend", (e) => {
  if (e.animationName === "mad") frame.classList.remove("mad");
});

function scold() {
  const text = scolds[Math.floor(Math.random() * scolds.length)];
  bubble.classList.add("angry");
  live.textContent = text;
  type(text);
  replay(bubble, "hit");
  replay(frame, "mad");
}

function flash() {
  flashEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 450 });
}

async function cutscene() {
  fighting = true;
  mute.hidden = false;
  audio();
  skipped = false;
  clearInterval(typer);
  words.classList.remove("cursor");
  cutsm.textContent = "Sage of the Sunbeam";
  cutbig.textContent = "The Tangerine Cat";
  cut.className = "cut";
  cut.hidden = false;
  void cut.offsetWidth;
  cut.classList.add("on");
  replay(cut, "shake");
  await sleep(900);
  cut.classList.add("zoom");
  await sleep(1200);
  cut.classList.add("eyes");
  flash();
  boom();
  replay(cut, "shake");
  await sleep(1100);
  cut.classList.add("title");
  flash();
  boom();
  await sleep(1600);
  cutline.textContent = "You clicked too fast, youngin. Now you face my wrath.";
  cut.classList.add("talk");
  await sleep(2400);
  cut.hidden = true;
  startFight();
}

function draw() {
  hpEl.style.width = boss + "%";
  hearts.textContent = "❤️".repeat(me) + "🖤".repeat(3 - me);
}

function say(text) {
  taunt.textContent = text;
}

function startFight() {
  boss = 100;
  me = 3;
  running = true;
  field.innerHTML = "";
  endEl.hidden = true;
  arena.classList.remove("rage", "stealing", "watch", "twitch");
  field.hidden = false;
  stealEl.hidden = true;
  sneak.hidden = true;
  hud2.hidden = true;
  arena.hidden = false;
  draw();
  say("Tangerine time.");
  startMusic(false);
  loop();
}

function loop() {
  if (!running) return;
  throwOne();
  spawner = setTimeout(loop, 900);
}

function throwOne() {
  const el = document.createElement("span");
  el.className = "orange";
  el.textContent = "🍊";
  el.style.left = 6 + Math.random() * 80 + "%";
  field.appendChild(el);
  const dur = Math.max(1300, 2300 - bossLevel * 180) + Math.random() * 400;
  el.anim = el.animate([
    { transform: "translateY(-70px) rotate(0deg)" },
    { transform: `translateY(${field.clientHeight - 50}px) rotate(540deg)` }
  ], { duration: dur, easing: "ease-in" });
  el.addEventListener("pointerdown", () => {
    if (!running || el.dead) return;
    el.dead = true;
    pop(el);
    hitBoss();
  });
  el.anim.onfinish = () => {
    if (el.dead || !running) return;
    el.remove();
    hurtMe();
  };
}

function pop(el) {
  const t = getComputedStyle(el).transform;
  el.anim.cancel();
  el.style.transform = t;
  el.textContent = "💥";
  el.animate([{ opacity: 1, scale: "1" }, { opacity: 0, scale: "2" }], { duration: 300 }).onfinish = () => el.remove();
}

function hitBoss() {
  boss -= 5;
  draw();
  replay(bossBox, "hurt");
  if (boss === 50) {
    phaseTwo();
  } else if (boss > 0 && boss % 20 === 0) {
    say(taunts[Math.floor(Math.random() * taunts.length)]);
  }
}

function hurtMe() {
  me -= 1;
  draw();
  replay(arena, "shake");
  say("Ha! Too slow.");
  if (me <= 0) finish(false);
}

function finish(result) {
  won = result;
  let bonus = 0;
  if (won) {
    bossLevel += 1;
    mult *= 2;
    bonus = Math.ceil(Math.max(perSec() * 300, perClick() * 300));
    earn(bonus);
    save();
  }
  running = false;
  clearTimeout(spawner);
  clearInterval(ticker);
  stopMusic();
  release();
  arena.classList.remove("watch", "twitch");
  field.querySelectorAll(".orange").forEach((o) => o.remove());
  endT.textContent = won ? "Victory" : "Defeated";
  endP.textContent = won
    ? `You stole my tangerine. Nobody has ever done that. Take this: "${next()}"`
    : "Go nap, youngin. Come back when your thumb has calmed down.";
  endEl.hidden = false;
  reward.hidden = !won;
  reward.innerHTML = `<b>×2</b> wisdom forever<br><b>+${fmt(bonus)}</b> bonus wisdom`;
  if (won) burst();
}

again.addEventListener("click", () => {
  arena.hidden = true;
  mute.hidden = true;
  fighting = false;
  rage = 0;
  lastClick = performance.now();
  bubble.classList.remove("angry");
  render();
  const text = won
    ? "Hmph. Respect, youngin. Click as fast as you like."
    : "Hmph. Come back when you are ready, youngin.";
  live.textContent = text;
  type(text);
  replay(bubble, "hit");
});


const mute = document.getElementById("mute");
const cutsm = document.getElementById("cutsm");
const cutbig = document.getElementById("cutbig");
const hud2 = document.getElementById("hud2");
const sbar = document.getElementById("sbar");
const stealEl = document.getElementById("steal");
const hand = document.getElementById("hand");
const sneak = document.getElementById("sneak");

let ctx = null;
let master = null;
let bus = null;
let noiseBuf = null;
let musicTimer = null;
let step = 0;
let nextTime = 0;
let intense = false;
let muted = false;
let ticker = null;
let progress = 0;
let holding = false;
let caught = false;

const roots = [82.41, 82.41, 65.41, 73.42, 82.41, 82.41, 65.41, 87.31];
const chords = [
  [329.63, 392, 493.88], [329.63, 392, 493.88], [261.63, 329.63, 392], [293.66, 369.99, 440],
  [329.63, 392, 493.88], [329.63, 392, 493.88], [261.63, 329.63, 392], [349.23, 440, 523.25]
];
const octs = [0, 0, 12, 0, 0, 0, 12, 0, 0, 0, 12, 0, 0, 12, 0, 12];
const arp = [0, 1, 2, 1];

function audio() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.5;
    bus = ctx.createGain();
    const comp = ctx.createDynamicsCompressor();
    bus.connect(master);
    master.connect(comp);
    comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}

function unfade() {
  bus.gain.cancelScheduledValues(ctx.currentTime);
  bus.gain.setValueAtTime(1, ctx.currentTime);
}

function tone(type, freq, t, dur, vol, opts = {}) {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (opts.to) o.frequency.exponentialRampToValueAtTime(opts.to, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  let node = o;
  if (opts.lp) {
    const f = ctx.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.value = opts.lp;
    o.connect(f);
    node = f;
  }
  node.connect(g);
  g.connect(bus);
  o.start(t);
  o.stop(t + dur + 0.02);
}

function noise(t, dur, vol, hp) {
  const s = ctx.createBufferSource();
  const f = ctx.createBiquadFilter();
  const g = ctx.createGain();
  s.buffer = noiseBuf;
  f.type = "highpass";
  f.frequency.value = hp;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f);
  f.connect(g);
  g.connect(bus);
  s.start(t);
  s.stop(t + dur + 0.02);
}

function play(s, t) {
  const bar = Math.floor(s / 16) % 8;
  const i = s % 16;
  if (i % 4 === 0 || (intense && i === 14)) tone("sine", 160, t, 0.14, 0.9, { to: 40 });
  if (i === 4 || i === 12) {
    noise(t, 0.15, 0.5, 1500);
    tone("triangle", 190, t, 0.08, 0.3);
  }
  if (intense && s % 32 >= 28) noise(t, 0.05, 0.3, 2500);
  if (intense || i % 2 === 0) noise(t, 0.04, 0.15, 7000);
  tone("sawtooth", roots[bar] * 2 ** (octs[i] / 12), t, 0.1, 0.28, { lp: intense ? 1100 : 500 });
  if (intense || i % 2 === 0) {
    const k = arp[Math.floor(i / (intense ? 1 : 2)) % 4];
    const lift = intense && bar % 2 ? 2 : 1;
    tone("square", chords[bar][k] * lift, t, 0.09, 0.07, { lp: 3000 });
  }
}

function schedule() {
  const spb = 60 / (intense ? 176 : 148) / 4;
  if (nextTime < ctx.currentTime) nextTime = ctx.currentTime + 0.05;
  while (nextTime < ctx.currentTime + 0.2) {
    play(step, nextTime);
    step += 1;
    nextTime += spb;
  }
}

function startMusic(fast) {
  if (!audio()) return;
  clearInterval(musicTimer);
  unfade();
  intense = fast;
  step = 0;
  nextTime = ctx.currentTime + 0.1;
  musicTimer = setInterval(schedule, 40);
}

function stopMusic() {
  clearInterval(musicTimer);
  musicTimer = null;
  if (bus) bus.gain.setTargetAtTime(0, ctx.currentTime, 0.15);
}

function boom() {
  if (!audio()) return;
  unfade();
  const t = ctx.currentTime;
  tone("sine", 90, t, 1.2, 1, { to: 28 });
  noise(t, 0.8, 0.5, 200);
}

mute.addEventListener("click", () => {
  muted = !muted;
  mute.textContent = muted ? "🔇" : "🔊";
  if (master) master.gain.value = muted ? 0 : 0.5;
});

async function phaseTwo() {
  running = false;
  clearTimeout(spawner);
  field.querySelectorAll(".orange").forEach((o) => o.remove());
  stopMusic();
  skipped = false;
  cutsm.textContent = "He is not amused";
  cutbig.textContent = "Phase Two";
  cutline.textContent = "Enough games. You want my tangerine? Come and take it.";
  cut.className = "cut";
  cut.hidden = false;
  void cut.offsetWidth;
  cut.classList.add("on", "zoom");
  replay(cut, "shake");
  boom();
  await sleep(600);
  cut.classList.add("eyes");
  flash();
  await sleep(700);
  cut.classList.add("title", "talk");
  flash();
  boom();
  await sleep(2200);
  cut.hidden = true;
  startSteal();
}

function startSteal() {
  me = Math.max(me, 2);
  progress = 0;
  holding = false;
  caught = false;
  draw();
  arena.classList.add("rage", "stealing");
  field.hidden = true;
  stealEl.hidden = false;
  sneak.hidden = false;
  hud2.hidden = false;
  sbar.style.width = "0%";
  hand.style.transform = "none";
  running = true;
  startMusic(true);
  cycle();
  ticker = setInterval(tick, 50);
}

function cycle() {
  if (!running) return;
  arena.classList.remove("watch", "twitch");
  say("...zzz...");
  const calm = Math.max(500, 1800 - bossLevel * 120 - progress * 10) + Math.random() * 800;
  spawner = setTimeout(() => {
    arena.classList.add("twitch");
    say("...hm?");
    spawner = setTimeout(() => {
      arena.classList.remove("twitch");
      arena.classList.add("watch");
      say("I SEE YOU!");
      spawner = setTimeout(cycle, 900 + Math.random() * 700);
    }, 380);
  }, calm);
}

function tick() {
  if (!running) return;
  const watching = arena.classList.contains("watch");
  if (holding && !caught) {
    if (watching) {
      caught = true;
      progress = Math.max(0, progress - 25);
      replay(bossBox, "hurt");
      hurtMe();
      say("CAUGHT! Hands off!");
    } else {
      progress = Math.min(100, progress + 1.1);
      if (progress >= 100) {
        finish(true);
        return;
      }
    }
  }
  sbar.style.width = progress + "%";
  hand.style.transform = `translateY(-${(progress / 100) * Math.max(0, stealEl.clientHeight - 90)}px)`;
}

function press() {
  holding = true;
  sneak.classList.add("down");
}

function release() {
  holding = false;
  caught = false;
  sneak.classList.remove("down");
}

sneak.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  press();
});

["pointerup", "pointercancel", "pointerleave"].forEach((ev) => sneak.addEventListener(ev, release));
sneak.addEventListener("contextmenu", (e) => e.preventDefault());

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && running && arena.classList.contains("stealing")) {
    e.preventDefault();
    press();
  }
});

document.addEventListener("keyup", (e) => {
  if (e.code === "Space") release();
});
const KEY = "wisdom-clicker-save";

const ups = [
  { name: "Slow Blink", desc: "+1 per click", base: 25, click: 1 },
  { name: "Sunbeam Nap", desc: "+1 per second", base: 80, sec: 1 },
  { name: "Tangerine Polish", desc: "+6 per click", base: 600, click: 6 },
  { name: "Cardboard Box", desc: "+6 per second", base: 900, sec: 6 },
  { name: "Window Seat", desc: "+40 per second", base: 8000, sec: 40 },
  { name: "Zen Stare", desc: "+40 per click", base: 9000, click: 40 },
  { name: "Midnight Zoomies", desc: "+260 per second", base: 70000, sec: 260 },
  { name: "Sage Aura", desc: "+300 per click", base: 120000, click: 300 },
  { name: "Tangerine Grove", desc: "+1,800 per second", base: 600000, sec: 1800 },
  { name: "Third Eye", desc: "+2,500 per click", base: 3000000, click: 2500 },
  { name: "Council of Cats", desc: "+14,000 per second", base: 5500000, sec: 14000 },
  { name: "Moon Monastery", desc: "+110,000 per second", base: 50000000, sec: 110000 },
  { name: "Cosmic Loaf", desc: "+900,000 per second", base: 480000000, sec: 900000 }
];

const wis = document.getElementById("wis");
const pc = document.getElementById("pc");
const ps = document.getElementById("ps");
const mu = document.getElementById("mu");
const list = document.getElementById("ups");
const challenge = document.getElementById("challenge");
const chsub = document.getElementById("chsub");
const layout = document.querySelector(".layout");
const tab = document.getElementById("tab");
const hint = document.getElementById("hint");
const reward = document.getElementById("reward");

let bank = 0;
let earned = 0;
let mult = 1;
let bossLevel = 0;
let owned = ups.map(() => 0);
let clicks = 0;
let instant = false;

const units = ["", "K", "M", "B", "T", "Qa"];

function fmt(n) {
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : String(Math.floor(n));
  const e = Math.min(Math.floor(Math.log10(n) / 3), units.length - 1);
  return (n / 1000 ** e).toFixed(2).replace(/\.?0+$/, "") + units[e];
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (!s) return;
    bank = s.bank || 0;
    earned = s.earned || 0;
    mult = s.mult || 1;
    bossLevel = s.bossLevel || 0;
    owned = ups.map((_, i) => (s.owned && s.owned[i]) || 0);
  } catch (e) {
    owned = ups.map(() => 0);
  }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ bank, earned, mult, bossLevel, owned }));
  } catch (e) {
    return;
  }
}

const cost = (i) => Math.ceil(ups[i].base * 1.22 ** owned[i]);
const perClick = () => (1 + ups.reduce((s, u, i) => s + (u.click || 0) * owned[i], 0)) * mult;
const perSec = () => ups.reduce((s, u, i) => s + (u.sec || 0) * owned[i], 0) * mult;
const bossNeed = () => 2000 * 8 ** bossLevel;

function earn(n) {
  bank += n;
  earned += n;
}

const rows = ups.map((u, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "up";
  b.innerHTML = `<span class="own">0</span><span class="info"><b>${u.name}</b><small>${u.desc}</small></span><span class="cost"></span>`;
  b.addEventListener("click", () => buy(i));
  list.appendChild(b);
  return { b, own: b.querySelector(".own"), cost: b.querySelector(".cost") };
});

function render() {
  wis.textContent = fmt(bank);
  pc.textContent = "+" + fmt(perClick()) + " per click";
  ps.textContent = fmt(perSec()) + " per sec";
  mu.textContent = "×" + fmt(mult) + " boss bonus";
  mu.hidden = mult <= 1;
  rows.forEach((r, i) => {
    const c = cost(i);
    r.own.textContent = owned[i];
    r.cost.textContent = "✨ " + fmt(c);
    r.b.classList.toggle("poor", bank < c);
    r.b.hidden = !(owned[i] || earned >= ups[i].base * 0.4);
  });
  const ready = earned >= bossNeed();
  hint.hidden = rows.every((r) => !r.b.hidden);
  tab.classList.toggle("alert", layout.classList.contains("hide") && (ready || ups.some((_, i) => bank >= cost(i))));
  challenge.disabled = !ready;
  chsub.textContent = ready ? "Win for ×2 wisdom forever + bonus" : "Unlocks at " + fmt(bossNeed()) + " total wisdom";
}

function buy(i) {
  const c = cost(i);
  if (bank < c) {
    replay(rows[i].b, "nope");
    return;
  }
  bank -= c;
  owned[i] += 1;
  replay(rows[i].b, "bought");
  render();
  save();
}

function floatText(text, x, y) {
  const el = document.createElement("span");
  el.className = "float";
  el.textContent = text;
  el.style.left = x + "px";
  el.style.top = y + "px";
  document.body.appendChild(el);
  el.animate([
    { transform: "translate(-50%, 0)", opacity: 1 },
    { transform: "translate(-50%, -70px)", opacity: 0 }
  ], { duration: 800, easing: "ease-out" }).onfinish = () => el.remove();
}

btn.addEventListener("click", (e) => {
  if (fighting || !wisdom.length) return;
  const now = performance.now();
  rage = now - lastClick < 400 ? Math.min(rage + 1, 20) : 0;
  instant = rage > 0;
  lastClick = now;
  clicks += 1;
  const gain = perClick();
  earn(gain);
  const r = btn.getBoundingClientRect();
  const x = e.detail ? e.clientX : r.left + r.width / 2;
  const y = e.detail ? e.clientY : r.top;
  floatText("+" + fmt(gain), x + (Math.random() - 0.5) * 60, y - 10);
  if (rage >= 4 && Math.random() < 0.2) {
    scold();
  } else {
    bubble.classList.remove("angry");
    speak();
  }
  render();
});

challenge.addEventListener("click", () => {
  if (fighting || earned < bossNeed()) return;
  cutscene();
});

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("Reset all progress?")) return;
  try {
    localStorage.removeItem(KEY);
  } catch (e) {
    return;
  }
  location.reload();
});

load();
render();

setInterval(() => {
  const s = perSec();
  if (s) earn(s / 10);
  render();
}, 100);

setInterval(save, 5000);

tab.addEventListener("click", () => {
  const hidden = layout.classList.toggle("hide");
  tab.setAttribute("aria-expanded", String(!hidden));
  tab.setAttribute("aria-label", hidden ? "Show upgrades" : "Hide upgrades");
  render();
});

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.target === document.body && !e.repeat && !fighting) {
    e.preventDefault();
    btn.click();
  }
});
</script>
</body>
</html>
